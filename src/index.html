<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sView</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 画像表示ステージ（フィット表示中はウィンドウのドラッグ領域を兼ねる） -->
    <div id="stage" data-tauri-drag-region>
      <img id="image" alt="" draggable="false" />
      <div id="placeholder">
        <p class="big">sView</p>
        <p>画像をここにドロップ / クリックしてファイルを開く</p>
        <p class="dim">← → で同じフォルダ内を移動</p>
      </div>
      <div id="error" hidden></div>
    </div>

    <!-- ホバー時のみ表示されるオーバーレイUI -->
    <div id="chrome">
      <div id="titlebar" data-tauri-drag-region>
        <span id="filename" data-tauri-drag-region></span>
        <span id="counter" data-tauri-drag-region></span>
        <div id="win-buttons">
          <button id="btn-min" title="最小化" aria-label="最小化">&#x2500;</button>
          <button id="btn-max" title="最大化 / 復元" aria-label="最大化">&#x25A1;</button>
          <button id="btn-close" title="閉じる" aria-label="閉じる">&#x2715;</button>
        </div>
      </div>
      <button id="nav-prev" class="nav" title="前の画像 (←)" aria-label="前の画像">&#x276E;</button>
      <button id="nav-next" class="nav" title="次の画像 (→)" aria-label="次の画像">&#x276F;</button>
    </div>

    <div id="drop-hint">ドロップして開く</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
