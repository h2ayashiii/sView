<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sView</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- 画像・動画・音楽の表示ステージ（フィット表示中はウィンドウのドラッグ領域を兼ねる）。
         動画と音楽は OS の WebView が持つデコーダで再生する（コーデックは同梱しない）。
         音楽も #video で鳴らし（映像は出さない）、代わりに #audio にアートワークと曲名を出す -->
    <div id="stage" data-tauri-drag-region>
      <img id="image" alt="" draggable="false" />
      <video id="video" hidden playsinline preload="metadata" disablepictureinpicture></video>
      <!-- 音楽を表示しているときだけ出す。上にアートワーク、下の帯（ウィンドウの「＋α」の部分）に
           曲名・アーティストと細い再生位置のバーを出す。再生操作のカードはこの帯の上に重なる -->
      <div id="audio" hidden>
        <div id="audio-art">
          <img id="artwork" alt="" draggable="false" />
        </div>
        <div id="audio-panel">
          <p id="audio-title"></p>
          <p id="audio-sub"></p>
          <div id="audio-progress"><div id="audio-progress-fill"></div></div>
        </div>
      </div>
      <div id="placeholder">
        <p class="big">sView</p>
        <p>画像・動画・音楽・フォルダ・圧縮フォルダ (zip / cbz) をここにドロップ</p>
        <p class="dim">クリック または <code>O</code> でファイル、<code>D</code> でフォルダを開く</p>
        <p class="dim">← → で移動</p>
      </div>
      <div id="error" hidden></div>
    </div>

    <!-- マウスを動かしている間だけ表示されるオーバーレイUI -->
    <div id="chrome">
      <!-- ウィンドウ操作ボタン。OS の慣習に合わせて macOS は左上・
           「閉じる / 最小化 / 最大化」、それ以外は右上・「最小化 / 最大化 / 閉じる」
           （位置は #app.mac、並び順は CSS の order で切り替える）。
           アイコンは字形の有無に左右されないよう SVG で描く。macOS では
           i-mac（信号機ボタンの上に出す記号）だけを使う -->
      <div id="titlebar" data-tauri-drag-region>
        <div id="wincontrols">
          <button id="btn-min" class="wc" title="最小化" aria-label="最小化">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 5h7" /></svg>
            <svg class="i-mac" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.8 6h6.4" /></svg>
          </button>
          <button id="btn-max" class="wc" title="最大化" aria-label="最大化">
            <svg class="i-max" viewBox="0 0 10 10" aria-hidden="true">
              <rect x="1.5" y="1.5" width="7" height="7" rx="1" />
            </svg>
            <svg class="i-restore" viewBox="0 0 10 10" aria-hidden="true">
              <path d="M3.2 3.2V1.5h5.3v5.3H6.8" />
              <rect x="1.5" y="3.2" width="5.3" height="5.3" rx="1" />
            </svg>
            <svg class="i-mac" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 2.8v6.4M2.8 6h6.4" /></svg>
          </button>
          <button id="btn-close" class="wc" title="閉じる (Esc)" aria-label="閉じる">
            <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M2 2l6 6M8 2l-6 6" /></svg>
            <svg class="i-mac" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.6 3.6l4.8 4.8M8.4 3.6l-4.8 4.8" /></svg>
          </button>
        </div>
      </div>
      <button id="nav-prev" class="nav" title="前の画像 (←)" aria-label="前の画像">&#x276E;</button>
      <button id="nav-next" class="nav" title="次の画像 (→)" aria-label="次の画像">&#x276F;</button>
      <!-- 動画・音楽を表示しているときだけ出す再生操作（下部中央のカード）。
           上段にシークバー、下段は左に再生時間・中央に再生ボタン類・右に音量。
           ウィンドウのドラッグ領域にはしない（シーク操作がウィンドウの移動にならないように） -->
      <div id="videobar">
        <!-- シークバー・音量つまみにカーソルを乗せたときの時刻 / 音量の表示 -->
        <div id="vb-tip" hidden></div>
        <div class="vb-top">
          <input id="vb-seek" type="range" min="0" max="1000" step="1" value="0" aria-label="再生位置" />
        </div>
        <div class="vb-bottom">
          <div class="vb-left">
            <span class="vb-time"><span id="vb-time">0:00</span> / <span id="vb-duration">0:00</span></span>
          </div>
          <div class="vb-center">
            <button id="vb-prev" class="vb" type="button" title="前のファイル" aria-label="前のファイル">
              <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 2h1.3v6H1.5zM8.5 2v6L3.2 5z" /></svg>
            </button>
            <button id="vb-back" class="vb" type="button" title="5 秒戻る (←)" aria-label="5 秒戻る">
              <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 2.5L1.5 5 5 7.5zM8.5 2.5L5 5l3.5 2.5z" /></svg>
            </button>
            <button id="vb-play" class="vb" type="button" title="再生 (Space)" aria-label="再生">
              <svg class="i-play" viewBox="0 0 10 10" aria-hidden="true"><path d="M3 1.8v6.4L8.2 5z" /></svg>
              <svg class="i-pause" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.2 2v6M6.8 2v6" /></svg>
            </button>
            <button id="vb-fwd" class="vb" type="button" title="5 秒進む (→)" aria-label="5 秒進む">
              <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M1.5 2.5L5 5 1.5 7.5zM5 2.5L8.5 5 5 7.5z" /></svg>
            </button>
            <button id="vb-next" class="vb" type="button" title="次のファイル" aria-label="次のファイル">
              <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M7.2 2h1.3v6H7.2zM1.5 2v6L6.8 5z" /></svg>
            </button>
          </div>
          <div class="vb-right">
            <button id="vb-mute" class="vb" type="button" title="消音 (M)" aria-label="消音">
              <svg class="i-sound" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M1.5 3.8h1.8L5.6 2v6L3.3 6.2H1.5z" /><path d="M7.2 3.4q1.2 1.6 0 3.2" />
              </svg>
              <svg class="i-muted" viewBox="0 0 10 10" aria-hidden="true">
                <path d="M1.5 3.8h1.8L5.6 2v6L3.3 6.2H1.5z" /><path d="M7 4l2 2M9 4L7 6" />
              </svg>
            </button>
            <input id="vb-volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量" />
          </div>
        </div>
      </div>
      <!-- 表示中のファイル（書庫内はその中のパス）は左下、枚数は右下に出す -->
      <div id="statusbar" data-tauri-drag-region>
        <span id="filename" data-tauri-drag-region></span>
        <span id="counter" data-tauri-drag-region></span>
      </div>
    </div>

    <div id="drop-hint">ドロップして開く</div>

    <!-- 右クリックメニュー（中身は main.js が組み立てる） -->
    <div id="ctxmenu" role="menu" hidden></div>

    <!-- 削除の確認。設定「削除の前に確認する」がオンのときだけ出す -->
    <div id="confirm" hidden role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div id="confirm-box">
        <p id="confirm-title">このファイルをゴミ箱へ移動しますか？</p>
        <p id="confirm-name"></p>
        <label id="confirm-skip-row">
          <input type="checkbox" id="confirm-skip" />
          <span>今後確認しない</span>
        </label>
        <div id="confirm-actions">
          <button id="confirm-cancel" type="button">キャンセル</button>
          <button id="confirm-ok" type="button" class="danger">ゴミ箱へ移動</button>
        </div>
      </div>
    </div>
  </div>

  <script src="settings-defs.js"></script>
  <script src="main.js"></script>
</body>
</html>
