<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>sView の設定</title>
  <link rel="stylesheet" href="settings.css" />
</head>
<body>
  <div id="win">
    <!-- 本体と同じく枠なし。上部が独自タイトルバー兼ドラッグ領域。
         閉じるボタンは macOS では左上の赤い信号機ボタンにする（#win.mac） -->
    <div id="s-titlebar" data-tauri-drag-region>
      <span id="s-title" data-tauri-drag-region>設定</span>
      <button id="s-close" title="閉じる (Esc)" aria-label="閉じる">
        <span class="i-other" aria-hidden="true">&#x2715;</span>
        <svg class="i-mac" viewBox="0 0 12 12" aria-hidden="true"><path d="M3.6 3.6l4.8 4.8M8.4 3.6l-4.8 4.8" /></svg>
      </button>
    </div>

    <!-- タブ（全般・画像・動画・音楽）。中身は settings.js が SETTINGS_TABS から作る -->
    <div id="s-tabs" role="tablist"></div>

    <!-- 選んだタブの項目だけを出す。収まらなくなったらここだけがスクロールする -->
    <div id="s-body"></div>

    <div id="s-footer">
      <button id="s-reset" class="ghost">既定に戻す</button>
      <span id="s-version"></span>
      <span id="s-status"></span>
    </div>
  </div>

  <script src="settings-defs.js"></script>
  <script src="settings.js"></script>
</body>
</html>
