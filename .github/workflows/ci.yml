name: ci

# PR と main への push で走る軽量チェック。バンドルは作らない
# （バンドルまで毎回作るとランナー時間とキャッシュを食うため。バンドルは build.yml）
on:
  push:
    branches: [main]
  pull_request:

# 同じ ref で実行が重なったら古い方を止める
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # cargo test でも tauri crate をリンクするため、GUI の開発パッケージが必要。
      # 無いと gdk-3.0.pc not found でコケる（コードの問題ではない）
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

