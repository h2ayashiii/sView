name: build

on:
  # バンドルビルドが走るのはリリースのとき（v から始まるタグ）と手動実行だけ。
  # PR と main への push の cargo test は ci.yml が受け持つ
  push:
    tags: ["v*"]
  # それ以外は必要なときだけ手動で実行する
  # （Actions タブ → build → Run workflow、または gh workflow run）
  workflow_dispatch:
    inputs:
      targets:
        description: ビルドする OS
        type: choice
        default: both
        options:
          - both
          - windows
          - macos

# GITHUB_TOKEN は既定で読み取りのみ。書き込みが要る job だけ個別に広げる
permissions:
  contents: read

# 同じ ref で実行が重なったら古い方を止める。
# タグを打ち直したときに release job が同じタグへ並行して upload するのも防ぐ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 手動実行で OS を選んだときはその 1 つだけビルドする。
        # タグ実行では inputs が空になるので、最後の候補（両方）に落ちる。
        # ジョブの if からは matrix を参照できず、ステップの if で絞ると
        # ランナー自体は起動してしまうため、matrix 自体をここで切り替える
        include: >-
          ${{ fromJSON(
          inputs.targets == 'windows' && '[{"os":"windows-latest","name":"windows"}]'
          || inputs.targets == 'macos' && '[{"os":"macos-latest","name":"macos"}]'
          || '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # 手動ビルドのバージョンを git describe で決めるため、タグと履歴も取得する
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # SHA で固定するとツールチェーン名を参照名から読めないため、明示する
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      # タグから作るときは、そのバージョンをアプリ側にも反映してからビルドする
      # （設定ウィンドウに出るバージョンと、成果物のファイル名がタグと一致する）
      - name: Apply version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        # タグ名は式で run に直接埋め込まず、環境変数で渡す（シェルに解釈させない）
        env:
          TAG: ${{ github.ref_name }}
        # Windows の既定シェル（pwsh）では "$TAG" が PowerShell の変数として空になるため、bash で動かす
        shell: bash
        run: node scripts/set-version.mjs "$TAG"

      # 手動ビルドでは、直近のタグ・そこからのコミット数・コミットハッシュから
      # 「0.3.0-dev.5.g3df11f1」のようなバージョンを作る（リリース版と見分けが付く）。
      # semver の制約上ビルドメタデータ（+...）は使えないため、プレリリース部分に入れる。
      # ハッシュは数字だけになることがあるので、先頭に g を付けて英数字の識別子にする
      - name: Apply development version
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -euo pipefail
          if desc=$(git describe --tags --long --match 'v[0-9]*' 2>/dev/null); then
            base=${desc%-*-g*}
            rest=${desc#"$base"-}
            count=${rest%%-*}
          else
            base="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
            count=$(git rev-list --count HEAD)
          fi
          base=${base%%-*}
          sha=$(git rev-parse --short=7 HEAD)
          node scripts/set-version.mjs "${base}-dev.${count}.g${sha}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run build

      # 配布するファイルだけを dist/ に平らに集める。
      # ここで集めたものがそのまま Artifacts の zip の中身になるので、
      # 展開すると .dmg / .exe が直接出てくる（bundle/nsis/... のような階層は作らない）
      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [ "${{ matrix.name }}" = "macos" ]; then
            # .app は dmg の中身と同じもの。ディレクトリなので zip 化で
            # 実行権限が落ちる。1 ファイルで済む .dmg だけを配る
            cp src-tauri/target/release/bundle/dmg/*.dmg dist/
          else
            cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/
            # インストール不要のポータブル版。インストーラと区別が付く名前にする
            cp src-tauri/target/release/sview.exe "dist/sView_${version}_x64-portable.exe"
          fi
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sView-${{ steps.collect.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # タグを打ったときだけ、成果物を GitHub Release に添付する。
  # Release の添付ファイルは zip に固められないので、.dmg / .exe を
  # そのままダウンロードできる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # リリースノートのファイルを読むためにリポジトリも取得する
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          # .github/release-notes/<タグ>.md があればそれをリリースノートにする。
          # 無ければ従来どおりマージ済み PR から自動生成する
          elif [ -f ".github/release-notes/${TAG}.md" ]; then
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" \
              --notes-file ".github/release-notes/${TAG}.md"
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
