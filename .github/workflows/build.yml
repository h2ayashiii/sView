name: build

on:
  # バンドルビルドが走るのはリリースのとき（v から始まるタグ）と手動実行だけ。
  # main への push と PR では、下の test job（cargo test のみ）が走る
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # それ以外は必要なときだけ手動で実行する
  # （Actions タブ → build → Run workflow、または gh workflow run）
  workflow_dispatch:
    inputs:
      targets:
        description: ビルドする OS
        type: choice
        default: both
        options:
          - both
          - windows
          - macos

# 同じ ref で実行が重なったら古い方を止める。
# タグを打ち直したときに release job が同じタグへ並行して upload するのも防ぐ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR と main への push で走る軽量チェック。バンドルは作らない
  # （バンドルまで毎回作るとランナー時間とキャッシュを食うため）
  test:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # cargo test でも tauri crate をリンクするため、GUI の開発パッケージが必要。
      # 無いと gdk-3.0.pc not found でコケる（コードの問題ではない）
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    # バンドルはタグと手動実行のときだけ。PR / main の push では test だけを走らせる
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        # 手動実行で OS を選んだときはその 1 つだけビルドする。
        # タグ実行では inputs が空になるので、最後の候補（両方）に落ちる。
        # ジョブの if からは matrix を参照できず、ステップの if で絞ると
        # ランナー自体は起動してしまうため、matrix 自体をここで切り替える
        include: >-
          ${{ fromJSON(
          inputs.targets == 'windows' && '[{"os":"windows-latest","name":"windows"}]'
          || inputs.targets == 'macos' && '[{"os":"macos-latest","name":"macos"}]'
          || '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # タグから作るときは、そのバージョンをアプリ側にも反映してからビルドする
      # （設定ウィンドウに出るバージョンと、成果物のファイル名がタグと一致する）
      - name: Apply version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run build

      # 配布するファイルだけを dist/ に平らに集める。
      # ここで集めたものがそのまま Artifacts の zip の中身になるので、
      # 展開すると .dmg / .exe が直接出てくる（bundle/nsis/... のような階層は作らない）
      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p dist
          if [ "${{ matrix.name }}" = "macos" ]; then
            # .app は dmg の中身と同じもの。ディレクトリなので zip 化で
            # 実行権限が落ちる。1 ファイルで済む .dmg だけを配る
            cp src-tauri/target/release/bundle/dmg/*.dmg dist/
          else
            cp src-tauri/target/release/bundle/nsis/*-setup.exe dist/
            # インストール不要のポータブル版。インストーラと区別が付く名前にする
            cp src-tauri/target/release/sview.exe "dist/sView_${version}_x64-portable.exe"
          fi
          ls -l dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sView-${{ steps.collect.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  # タグを打ったときだけ、成果物を GitHub Release に添付する。
  # Release の添付ファイルは zip に固められないので、.dmg / .exe を
  # そのままダウンロードできる
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" --title "$TAG" --generate-notes
          fi
