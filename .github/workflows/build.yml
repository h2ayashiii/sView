name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run build

      # GitHub の artifact は zip 化される際に実行権限とコード署名が失われ、
      # 展開した .app が「壊れている」と判定されるため tar で固めて渡す
      - name: Package macOS app bundle
        if: matrix.name == 'macos'
        working-directory: src-tauri/target/release/bundle/macos
        run: |
          codesign --verify --deep --strict --verbose=2 sView.app
          tar -czf sView-macos.tar.gz sView.app

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sview-${{ matrix.name }}
          path: |
            src-tauri/target/release/sview.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.tar.gz
          if-no-files-found: warn
