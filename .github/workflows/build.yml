name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # 任意のブランチで、必要なときだけ手動実行する用
  # （Actions タブ → build → Run workflow、または gh workflow run）
  workflow_dispatch:
    inputs:
      targets:
        description: ビルドする OS
        type: choice
        default: both
        options:
          - both
          - windows
          - macos

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # 手動実行で OS を選んだときはその 1 つだけビルドする。
        # push / タグ実行では inputs が空になるので、最後の候補（両方）に落ちる。
        # ジョブの if からは matrix を参照できず、ステップの if で絞ると
        # ランナー自体は起動してしまうため、matrix 自体をここで切り替える
        include: >-
          ${{ fromJSON(
          inputs.targets == 'windows' && '[{"os":"windows-latest","name":"windows"}]'
          || inputs.targets == 'macos' && '[{"os":"macos-latest","name":"macos"}]'
          || '[{"os":"windows-latest","name":"windows"},{"os":"macos-latest","name":"macos"}]'
          ) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build
        run: npm run build

      # macOS は .dmg のみを渡す。bundle/macos/sView.app は dmg バンドラが
      # そのまま中身として使うものなので、別途アップロードしても中身は同じ
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sview-${{ matrix.name }}
          path: |
            src-tauri/target/release/sview.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
