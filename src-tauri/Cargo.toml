[package]
name = "sview"
version = "0.1.0"
description = "Minimal frameless cross-platform image viewer"
edition = "2021"
# Commons Clause + MIT。この組み合わせに該当する SPDX 識別子がないため
# LicenseRef で示す。全文はリポジトリルートの LICENSE を参照
license = "LicenseRef-MIT-Commons-Clause"
authors = ["h2ayashiii"]
repository = "https://github.com/h2ayashiii/sView"

[lib]
name = "sview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# フォルダ監視。OS のネイティブ通知（inotify / FSEvents / ReadDirectoryChangesW）を使う
notify = "8"
# 削除はゴミ箱へ送る（完全削除はしない）。chrono を使うのはゴミ箱の中身を
# 一覧する API だけなので、既定機能を切って依存を増やさない
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }

# 軽量化: リリースバイナリを最小化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 完全に strip すると関数名も消えてバックトレースが読めなくなる。
# ベータ期間はデバッグ情報だけ落として関数名を残す（サイズ増は軽微）
strip = "debuginfo"
panic = "abort"
