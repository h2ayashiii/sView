[package]
name = "sview"
version = "0.1.0"
description = "Minimal frameless cross-platform image viewer"
edition = "2021"
license = "MIT"

[lib]
name = "sview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 軽量化: リリースバイナリを最小化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
