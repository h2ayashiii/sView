[package]
name = "sview"
version = "0.1.0"
description = "Minimal frameless cross-platform viewer for images, videos and audio"
edition = "2024"
# Commons Clause + MIT。この組み合わせに該当する SPDX 識別子がないため
# LicenseRef で示す。全文はリポジトリルートの LICENSE を参照
license = "LicenseRef-MIT-Commons-Clause"
authors = ["h2ayashiii"]
repository = "https://github.com/h2ayashiii/sView"

[lib]
name = "sview_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# フォルダ監視。OS のネイティブ通知（FSEvents / ReadDirectoryChangesW）を使う
notify = "8"
# 削除はゴミ箱へ送る（完全削除はしない）。chrono を使うのはゴミ箱の中身を
# 一覧する API だけなので、既定機能を切って依存を増やさない
trash = { version = "5", default-features = false, features = ["coinit_apartmentthreaded"] }
# 音楽ファイルのタグ（曲名・アーティスト・アルバム）と埋め込みアートワークを読む
lofty = "0.25"
# MKV のトラック情報を読む（テキスト字幕の取り出しと、macOS での fragmented MP4 への詰め直しに使う）
matroska-demuxer = "0.8"
# MKV の字幕に掛かっている zlib 圧縮を戻す。zip と同じ版・同じ実装（zlib-rs）にそろえる
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

# 拡張子の関連付け（Windows のレジストリ操作）
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# macOS: 非アクティブなウィンドウでもカーソルの出入り・移動を拾う（NSTrackingArea）。
# tauri / tao が使っているのと同じ版に合わせる
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSTrackingArea", "NSView", "NSWindow"] }

# macOS（Apple Silicon）: AV1 のハードウェアデコーダを持たない M1 / M2 世代向けに
# ソフトウェアデコード（rav1d）を行う。Apple Silicon には SVE2 が無いため外す。
# crates.io 版の rav1d 1.1.0 はパッケージ除外設定の不具合で src/arm/asm-offsets.h が欠落し
# arm64 アセンブリのビルドに失敗するため、修正版が crates.io に公開されるまで公式タグを参照する
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0", default-features = false, features = ["asm", "asm_arm64_dotprod", "asm_arm64_i8mm", "bitdepth_8", "bitdepth_16"] }

# macOS（Intel など aarch64 以外）: nasm に依存せずビルドできるよう Rust 実装を使う
[target.'cfg(all(target_os = "macos", not(target_arch = "aarch64")))'.dependencies]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

# Linux の CI でも rav1d デコーダと AV1 変換経路をテストする（配布バイナリには含まれない）
[target.'cfg(target_os = "linux")'.dev-dependencies]
rav1d = { git = "https://github.com/memorysafety/rav1d", tag = "v1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"] }

# 軽量化: リリースバイナリを最小化
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# 完全に strip すると関数名も消えてバックトレースが読めなくなる。
# ベータ期間はデバッグ情報だけ落として関数名を残す（サイズ増は軽微）
strip = "debuginfo"
panic = "abort"
